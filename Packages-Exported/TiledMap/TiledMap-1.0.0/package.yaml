displayName: Tiled Map
description: 2D tile palettes, atlas regions and tilemaps with runtime painting, camera culling, sorting, pixel snapping, collision generation and hot-update-aware texture caching. Create palettes from texture atlases, paint and erase tiles in the editor or at runtime, and render large maps with camera culling. Includes TilemapCollider2D integration with Physics2D, palette and tilemap editors, painting examples and resource-loading documentation.
